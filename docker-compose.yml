services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yanduoduo
      POSTGRES_PASSWORD: yanduoduo
      POSTGRES_DB: yanduoduo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanduoduo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://yanduoduo:yanduoduo@db:5432/yanduoduo
      REDIS_URL: redis://redis:6379/0
      SQL_ECHO: "0"
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
