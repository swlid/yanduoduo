<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>研多多管理后台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6fb; color: #1f2937; }
    header { background: #111827; color: #fff; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; color: #9ca3af; font-size: 13px; }
    .container { max-width: 980px; margin: 24px auto; padding: 0 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { padding: 9px 16px; border: 0; border-radius: 10px; background: #e5e7eb; cursor: pointer; font-weight: 600; }
    .tab.active { background: #2563eb; color: #fff; }
    .panel { display: none; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; }
    .panel.active { display: block; }
    .field { margin-bottom: 12px; }
    label { display: block; color: #6b7280; font-size: 13px; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    textarea { min-height: 90px; resize: vertical; }
    button { padding: 9px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-weight: 600; }
    button.secondary { background: #eef2ff; color: #2563eb; }
    .list { margin-top: 16px; }
    .item { border-top: 1px solid #f3f4f6; padding: 12px 0; }
    .item h3 { margin: 0 0 6px; font-size: 16px; }
    .muted { color: #6b7280; font-size: 13px; }
    .result { margin-top: 12px; padding: 10px; border-radius: 8px; background: #ecfdf5; color: #059669; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>研多多管理后台</h1>
    <p>数据维护 · 纠错审核 · 资讯发布（MVP 演示，无鉴权）</p>
  </header>

  <main class="container">
    <nav class="tabs">
      <button class="tab active" data-tab="import">批量导入</button>
      <button class="tab" data-tab="corrections">纠错审核</button>
      <button class="tab" data-tab="articles">资讯发布</button>
    </nav>

    <section id="import" class="panel active">
      <div class="field">
        <label>数据类型</label>
        <select id="entityType">
          <option value="institution">院校</option>
          <option value="major">专业</option>
          <option value="institution_major">院校专业组合</option>
          <option value="admission_stat">历年招录数据</option>
        </select>
      </div>
      <div class="field">
        <label>CSV / Excel 文件</label>
        <input id="importFile" type="file" accept=".csv,.xlsx,.xls" />
      </div>
      <button onclick="doImport()">开始导入</button>
      <div id="importResult" class="result"></div>
    </section>

    <section id="corrections" class="panel">
      <button onclick="loadCorrections()">刷新待审核纠错</button>
      <div id="correctionsList" class="list"></div>
    </section>

    <section id="articles" class="panel">
      <div class="field">
        <label>标题</label>
        <input id="articleTitle" />
      </div>
      <div class="field">
        <label>分类</label>
        <select id="articleCategory">
          <option>政策</option>
          <option>资讯</option>
          <option>经验</option>
        </select>
      </div>
      <div class="field">
        <label>摘要</label>
        <input id="articleSummary" />
      </div>
      <div class="field">
        <label>正文</label>
        <textarea id="articleContent"></textarea>
      </div>
      <button onclick="publishArticle()">发布文章</button>
      <div id="articleResult" class="result"></div>
    </section>
  </main>

  <script>
    const API = "/api/v1";

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
        if (btn.dataset.tab === "corrections") loadCorrections();
      });
    });

    async function doImport() {
      const file = document.getElementById("importFile").files[0];
      if (!file) return alert("请选择文件");
      const form = new FormData();
      form.append("entity_type", document.getElementById("entityType").value);
      form.append("file", file);
      const result = document.getElementById("importResult");
      result.style.display = "block";
      result.textContent = "导入中...";
      try {
        const res = await fetch(`${API}/admin/import`, { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "导入失败");
        result.textContent = `成功：新增 ${data.created}，更新 ${data.updated}，共 ${data.rows} 行。`;
      } catch (err) {
        result.textContent = err.message;
      }
    }

    async function loadCorrections() {
      const box = document.getElementById("correctionsList");
      box.innerHTML = '<div class="muted">加载中...</div>';
      try {
        const res = await fetch(`${API}/admin/corrections?status=pending`);
        const items = await res.json();
        box.innerHTML = items.length ? "" : '<div class="muted">暂无待审核纠错</div>';
        items.forEach(item => {
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `
            <h3>${escapeHtml(item.entity_type)} / ${escapeHtml(item.field_name)}</h3>
            <div class="muted">原值：${escapeHtml(item.original_value || "-")} → 建议：${escapeHtml(item.suggested_value || "-")}</div>
            <div class="muted">备注：${escapeHtml(item.note || "-")}</div>
            <button onclick="reviewCorrection('${item.id}', 'approved')">通过</button>
            <button class="secondary" onclick="reviewCorrection('${item.id}', 'rejected')">驳回</button>
          `;
          box.appendChild(div);
        });
      } catch (err) {
        box.innerHTML = `<div class="muted">${err.message}</div>`;
      }
    }

    async function reviewCorrection(id, status) {
      await fetch(`${API}/admin/corrections/${id}/review`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ status, reviewed_by: "admin-demo" })
      });
      loadCorrections();
    }

    async function publishArticle() {
      const payload = {
        title: document.getElementById("articleTitle").value,
        category: document.getElementById("articleCategory").value,
        summary: document.getElementById("articleSummary").value,
        content: document.getElementById("articleContent").value,
        status: "published"
      };
      const result = document.getElementById("articleResult");
      result.style.display = "block";
      result.textContent = "发布中...";
      try {
        const res = await fetch(`${API}/admin/articles`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("发布失败");
        const data = await res.json();
        result.textContent = `发布成功：${data.title}`;
      } catch (err) {
        result.textContent = err.message;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    loadCorrections();
  </script>
</body>
</html>
