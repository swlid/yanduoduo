<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>研多多 · 择校数据库 MVP</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #dc2626;
      --warn: #d97706;
      --ok: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      padding: 18px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .12);
    }
    header h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0; opacity: .9; font-size: 13px; }
    .container { max-width: 1120px; margin: 24px auto; padding: 0 16px; }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .field label { color: var(--muted); }
    input, select, button {
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 13px;
      background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    .actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
    button {
      cursor: pointer;
      border: 0;
      font-weight: 600;
    }
    .primary { background: var(--primary); color: #fff; }
    .primary:hover { background: var(--primary-dark); }
    .secondary { background: #eef2ff; color: var(--primary); }
    .warn { background: #fff7ed; color: var(--warn); }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      position: relative;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.08); }
    .card h3 { margin: 0 0 6px; font-size: 18px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .badge {
      font-size: 12px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #eef2ff;
      color: var(--primary);
    }
    .badge.hot { background: #fef2f2; color: var(--danger); }
    .badge.mid { background: #fffbeb; color: var(--warn); }
    .badge.easy { background: #ecfdf5; color: var(--ok); }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .scores { display: flex; gap: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .score { flex: 1; }
    .score span { display: block; color: var(--muted); font-size: 12px; }
    .score strong { font-size: 20px; }
    .compare-box {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .compare-box input { width: 16px; height: 16px; }
    .empty {
      padding: 60px 0;
      text-align: center;
      color: var(--muted);
    }
    dialog {
      border: 0;
      border-radius: 16px;
      padding: 0;
      width: min(820px, calc(100vw - 32px));
      max-height: 86vh;
      box-shadow: 0 20px 60px rgba(0,0,0,.24);
    }
    dialog::backdrop { background: rgba(15, 23, 42, .45); }
    .modal-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      position: sticky;
      top: 0;
    }
    .modal-head h2 { margin: 0; font-size: 20px; }
    .modal-body { padding: 18px 20px; overflow: auto; max-height: calc(86vh - 74px); }
    .close { background: #f3f4f6; color: var(--muted); width: 34px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
    th { background: #f9fafb; }
    .compare-panel {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111827;
      color: #fff;
      padding: 10px 12px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      font-size: 13px;
    }
    .compare-panel button { background: var(--primary); color: #fff; height: 32px; }
    @media (max-width: 560px) {
      .filters { grid-template-columns: 1fr 1fr; }
      header h1 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>研多多 · 择校数据库 MVP</h1>
    <p>当前为 Mock 示例数据，仅用于功能演示，不代表真实招录事实</p>
  </header>

  <main class="container">
    <section class="filters">
      <div class="field">
        <label>关键词</label>
        <input id="keyword" placeholder="学校 / 专业 / 院系" />
      </div>
      <div class="field">
        <label>地区</label>
        <select id="province">
          <option value="">全部</option>
          <option>北京</option>
          <option>上海</option>
          <option>浙江</option>
          <option>江苏</option>
          <option>湖北</option>
          <option>陕西</option>
        </select>
      </div>
      <div class="field">
        <label>层次</label>
        <select id="level">
          <option value="">全部</option>
          <option>985</option>
          <option>211</option>
          <option>双一流</option>
          <option>普通</option>
        </select>
      </div>
      <div class="field">
        <label>学科门类</label>
        <select id="disciplineGate">
          <option value="">全部</option>
          <option>工学</option>
          <option>经济学</option>
          <option>教育学</option>
          <option>法学</option>
        </select>
      </div>
      <div class="field">
        <label>最低平均分</label>
        <input id="minAvg" type="number" min="0" max="750" placeholder="如 340" />
      </div>
      <div class="field">
        <label>数据年份</label>
        <select id="year">
          <option>2025</option>
          <option>2024</option>
          <option>2023</option>
        </select>
      </div>
      <div class="actions">
        <button class="primary" onclick="loadList()">查询</button>
        <button class="secondary" onclick="resetFilters()">重置</button>
        <span id="resultInfo"></span>
      </div>
    </section>

    <div class="toolbar">
      <span id="totalInfo">加载中...</span>
      <button class="warn" onclick="openCompare()">对比已选（<span id="compareCount">0</span>）</button>
    </div>

    <section id="cards" class="grid"></section>
    <div id="empty" class="empty" style="display:none">没有符合条件的结果</div>
  </main>

  <dialog id="detailDialog">
    <div class="modal-head">
      <h2 id="detailTitle">详情</h2>
      <button class="close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </dialog>

  <dialog id="compareDialog">
    <div class="modal-head">
      <h2>院校专业对比</h2>
      <button class="close" onclick="closeCompare()">×</button>
    </div>
    <div class="modal-body" id="compareBody"></div>
  </dialog>

  <div class="compare-panel" id="comparePanel" style="display:none">
    <span>已选 <strong id="comparePanelCount">0</strong> 个</span>
    <button onclick="openCompare()">开始对比</button>
  </div>

  <script>
    const API = "/api/v1";
    let selected = new Set();
    let currentItems = [];

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("请求失败: " + res.status);
      return res.json();
    }

    function buildQuery() {
      const p = new URLSearchParams();
      const keyword = document.getElementById("keyword").value.trim();
      const province = document.getElementById("province").value;
      const level = document.getElementById("level").value;
      const disciplineGate = document.getElementById("disciplineGate").value;
      const minAvg = document.getElementById("minAvg").value;
      const year = document.getElementById("year").value;
      if (keyword) p.set("keyword", keyword);
      if (province) p.set("province", province);
      if (level) p.set("level", level);
      if (disciplineGate) p.set("discipline_gate", disciplineGate);
      if (minAvg) p.set("min_avg_score", minAvg);
      p.set("year", year);
      p.set("page_size", "100");
      return p.toString();
    }

    function difficultyClass(value) {
      if (value === "冲刺") return "hot";
      if (value === "稳妥") return "mid";
      return "easy";
    }

    function renderList(items) {
      currentItems = items;
      const grid = document.getElementById("cards");
      const empty = document.getElementById("empty");
      document.getElementById("totalInfo").textContent = `共 ${items.length} 个院校专业组合`;
      if (!items.length) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      grid.innerHTML = items.map(item => {
        const ins = item.institution || {};
        const maj = item.major || {};
        const stat = item.latest_stat || {};
        const difficulty = stat.metrics?.difficulty || "未知";
        return `
          <article class="card" onclick="openDetail('${item.id}')">
            <div class="compare-box" onclick="event.stopPropagation()">
              <input type="checkbox" data-id="${item.id}" ${selected.has(item.id) ? "checked" : ""} onchange="toggleSelect(this)" />
              对比
            </div>
            <h3>${escapeHtml(ins.name)} · ${escapeHtml(maj.name)}</h3>
            <div class="badges">
              <span class="badge">${escapeHtml(ins.level || "")}</span>
              <span class="badge">${escapeHtml(ins.category || "")}</span>
              <span class="badge">${escapeHtml(maj.degree_type || "")}</span>
              <span class="badge ${difficultyClass(difficulty)}">${escapeHtml(difficulty)}</span>
            </div>
            <div class="meta">
              <div>${escapeHtml(item.faculty_name || "")} · ${escapeHtml(item.study_mode || "")}</div>
              <div>${escapeHtml(ins.province || "")} ${escapeHtml(ins.city || "")} · 学制 ${item.length ?? "-"} 年</div>
            </div>
            <div class="scores">
              <div class="score"><span>平均分</span><strong>${stat.avg_score ?? "-"}</strong></div>
              <div class="score"><span>报录比</span><strong>${stat.report_rate ?? "-"}</strong></div>
              <div class="score"><span>复录比</span><strong>${stat.reexam_admit_rate ?? "-"}</strong></div>
            </div>
          </article>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    async function loadList() {
      try {
        const data = await fetchJson(`${API}/institution-majors?${buildQuery()}`);
        renderList(data.items || []);
      } catch (err) {
        document.getElementById("totalInfo").textContent = err.message;
      }
    }

    function resetFilters() {
      document.getElementById("keyword").value = "";
      document.getElementById("province").value = "";
      document.getElementById("level").value = "";
      document.getElementById("disciplineGate").value = "";
      document.getElementById("minAvg").value = "";
      document.getElementById("year").value = "2025";
      loadList();
    }

    function toggleSelect(checkbox) {
      const id = checkbox.dataset.id;
      if (checkbox.checked) {
        if (selected.size >= 4) {
          checkbox.checked = false;
          alert("最多选择 4 个院校专业进行对比");
          return;
        }
        selected.add(id);
      } else {
        selected.delete(id);
      }
      updateCompareBar();
    }

    function updateCompareBar() {
      const count = selected.size;
      document.getElementById("compareCount").textContent = count;
      document.getElementById("comparePanelCount").textContent = count;
      document.getElementById("comparePanel").style.display = count ? "flex" : "none";
    }

    async function openCompare() {
      if (!selected.size) {
        alert("请先勾选要对比的院校专业");
        return;
      }
      const year = document.getElementById("year").value;
      try {
        const data = await fetchJson(
          `${API}/institution-majors/compare?ids=${[...selected].join(",")}&year=${year}`
        );
        document.getElementById("compareBody").innerHTML = compareHtml(data.items || []);
        document.getElementById("compareDialog").showModal();
      } catch (err) {
        alert(err.message);
      }
    }

    function compareHtml(items) {
      if (!items.length) return '<div class="empty">没有可对比的数据</div>';
      const metrics = [
        ["院校", i => `${i.institution.name} / ${i.major.name}`],
        ["院系", i => i.faculty_name],
        ["层次", i => i.institution.level],
        ["类型", i => i.institution.category],
        ["地区", i => `${i.institution.province} ${i.institution.city}`],
        ["学硕/专硕", i => i.major.degree_type],
        ["学制", i => `${i.length ?? "-"} 年`],
        ["平均分", i => i.latest_stat?.avg_score ?? "-"],
        ["报录比", i => i.latest_stat?.report_rate ?? "-"],
        ["复录比", i => i.latest_stat?.reexam_admit_rate ?? "-"],
        ["院线", i => i.latest_stat?.college_line ?? "-"],
        ["难度", i => i.latest_stat?.metrics?.difficulty ?? "-"]
      ];
      const thead = `<tr><th>指标</th>${items.map(i => `<th>${escapeHtml(i.institution.name)}<br>${escapeHtml(i.major.name)}</th>`).join("")}</tr>`;
      const tbody = metrics.map(([label, fn]) => `<tr><td>${label}</td>${items.map(i => `<td>${escapeHtml(fn(i))}</td>`).join("")}</tr>`).join("");
      return `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
    }

    function closeCompare() {
      document.getElementById("compareDialog").close();
    }

    async function openDetail(id) {
      try {
        const year = document.getElementById("year").value;
        const item = await fetchJson(`${API}/institution-majors/${id}?year=${year}`);
        document.getElementById("detailTitle").textContent =
          `${item.institution.name} · ${item.major.name}`;
        document.getElementById("detailBody").innerHTML = detailHtml(item);
        document.getElementById("detailDialog").showModal();
      } catch (err) {
        alert(err.message);
      }
    }

    function detailHtml(item) {
      const ins = item.institution;
      const maj = item.major;
      const stat = item.latest_stat || {};
      const years = item.admission_stats || [];
      const rows = years.map(s => `
        <tr>
          <td>${s.year}</td>
          <td>${s.plan_total}</td>
          <td>${s.applicant_count}</td>
          <td>${s.admitted_count}</td>
          <td>${s.report_rate ?? "-"}</td>
          <td>${s.avg_score ?? "-"}</td>
          <td>${s.college_line ?? "-"}</td>
        </tr>
      `).join("");
      return `
        <div class="badges" style="margin:0 0 10px">
          <span class="badge">${escapeHtml(ins.level)}</span>
          <span class="badge">${escapeHtml(ins.category)}</span>
          <span class="badge">${escapeHtml(ins.province)}</span>
          <span class="badge">${escapeHtml(maj.discipline_gate)}</span>
          <span class="badge">${escapeHtml(maj.degree_type)}</span>
          <span class="badge ${difficultyClass(stat.metrics?.difficulty)}">${escapeHtml(stat.metrics?.difficulty || "未知")}</span>
        </div>
        <div class="meta">
          <p>院系：${escapeHtml(item.faculty_name)}　学习方式：${escapeHtml(item.study_mode)}　学制：${item.length ?? "-"} 年</p>
          <p>学费：${escapeHtml(item.tuition || "-")}</p>
          <p>奖学金：${escapeHtml(item.scholarship || "-")}</p>
          <p>初试外语：${escapeHtml(item.exam_basic?.外语 || "-")}　数学：${escapeHtml(item.exam_basic?.数学 || "不考数学")}</p>
          <p>专业课：${escapeHtml(item.exam_major?.name || "-")}（${escapeHtml(item.exam_major?.code || "-")}）</p>
          <p>复试：${escapeHtml(JSON.stringify(item.reexam_form || {}))}</p>
        </div>
        <table>
          <thead>
            <tr><th>年份</th><th>招生</th><th>报考</th><th>录取</th><th>报录比</th><th>平均分</th><th>院线</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <p class="meta" style="margin-top:12px">数据来源：${escapeHtml(stat.source_name || "-")}　数据质量：${escapeHtml(stat.data_quality || "-")}</p>
      `;
    }

    function closeDetail() {
      document.getElementById("detailDialog").close();
    }

    document.getElementById("keyword").addEventListener("keydown", e => {
      if (e.key === "Enter") loadList();
    });

    loadList();
  </script>
</body>
</html>
